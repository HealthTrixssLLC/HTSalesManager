openapi: 3.1.0
info:
  title: Health Trixss CRM External API
  version: "1.5"
  description: |
    Secure external access to Health Trixss CRM data for forecasting
    applications, BI tools, and third-party integrations.

    ## Authentication
    Every request must carry an API key in the `x-api-key` header.
    Keys are generated in Admin Console → API Keys and shown only once.

    ## Key scoping
    - **System keys** (not bound to an organization) may read accounts and
      opportunities across all organizations.
    - **Organization-scoped keys** see only their organization's data.
      Contacts, leads, and activities endpoints REQUIRE an org-scoped key
      (system keys receive `403 Organization-bound API key required`).

    ## Permission scopes
    Each key carries permission scopes. Routes enforce:
    - `crm.read` — all GET endpoints (accounts, opportunities, contacts, leads, logs)
    - `crm.write` — POST /leads, PATCH on accounts/contacts/leads/opportunities,
      POST/DELETE opportunity-contact links
    - `activities.read` — GET /activities, GET /activities/:id, GET /activities/:id/tags
    - `activities.write` — POST /activities, PATCH /activities/:id,
      POST/DELETE /activities/:id/tags
    - Tag management (`/tags`) and CRM entity-tag routes use `crm.read` / `crm.write`.
      All tag routes require an organization-scoped key.
    Missing scopes return `403` with a `requiredPermission` field. Legacy keys
    with no explicit scopes are treated as having all scopes; an explicit empty
    list grants nothing.

    ## Monetary values
    `amount`, `actualRevenue`, and `estRevenue` are decimal values with
    2-decimal precision (currency units, e.g. US dollars), serialized as
    JSON strings such as `"50000.00"`. They are NOT integer cents.

    ## Canonical record ID prefixes
    Account `ACCT-*`, Contact `CONT-*`, Lead `LEAD-*`, Opportunity `OPP-*`,
    Activity `ACT-*`, Document `DOC-*`.
servers:
  - url: https://{crm-domain}/api/v1/external
    variables:
      crm-domain:
        default: your-crm-domain.example.com
security:
  - ApiKeyAuth: []
tags:
  - name: Accounts
  - name: Opportunities
  - name: Contacts
  - name: Leads
  - name: Activities
  - name: Documents
  - name: Tags
  - name: Logs

paths:
  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: List the organization's tags
      description: >
        Lists tags belonging to the API key's organization. Requires the
        `crm.read` scope and an organization-scoped key (403 for system keys).


        `curl -H "x-api-key: $KEY" "https://crm.example.com/api/v1/external/tags?search=priority&limit=50"`
      parameters:
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive substring match on tag name.
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Paginated tag list
          content:
            application/json:
              schema:
                type: object
                required: [data, pagination]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagObject"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
              example:
                data:
                  - { id: 4f6c4a3e-2b1d-4c8a-9e50-1a2b3c4d5e6f, name: priority, color: "#3b82f6" }
                pagination: { total: 1, limit: 100, offset: 0, hasMore: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientPermissions" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Tags]
      operationId: createTag
      summary: Create a tag
      description: >
        Creates an organization-scoped tag. Requires the `crm.write` scope and
        an organization-scoped key (403 for system keys). The name is
        normalized (trimmed, internal whitespace collapsed) and must be unique
        within the organization case-insensitively — duplicates return 409
        with `existingTagId`.


        `curl -X POST -H "x-api-key: $KEY" -H "Content-Type: application/json" -d '{"name":"priority"}' https://crm.example.com/api/v1/external/tags`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Tag name (normalized; unique per org, case-insensitive).
            example: { name: priority }
      responses:
        "201":
          description: Created tag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/TagObject"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientPermissions" }
        "409": { $ref: "#/components/responses/DuplicateTag" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /accounts/{id}/tags:
    get:
      tags: [Tags]
      operationId: getAccountTags
      summary: List tags on a account
      description: >
        Returns the tags attached to the account. Requires the
        `crm.read` scope and an organization-scoped key. 404 for missing or
        cross-org records.


        `curl -H "x-api-key: $KEY" https://crm.example.com/api/v1/external/accounts/ACCT-2025-00001/tags`
      parameters:
        - $ref: "#/components/parameters/RecordId"
      responses:
        "200":
          description: Tags attached to the record
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagObject"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientPermissions" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Tags]
      operationId: addAccountTag
      summary: Assign a tag to a account
      description: >
        Assigns an existing tag by `tagId` or by `name` (exactly one of the
        two). Requires the `crm.write` scope and an organization-scoped key.
        A name that does not exist in the organization returns 404 — tags are
        never auto-created. Idempotent: re-assigning an already-assigned tag
        is a no-op. Returns the record's current tag list. Cross-org tags and
        records return 404.


        `curl -X POST -H "x-api-key: $KEY" -H "Content-Type: application/json" -d '{"name":"priority"}' https://crm.example.com/api/v1/external/accounts/ACCT-2025-00001/tags`
      parameters:
        - $ref: "#/components/parameters/RecordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tagId:
                  type: string
                  description: ID of an existing tag in the organization.
                name:
                  type: string
                  maxLength: 100
                  description: Name of an existing tag (case-insensitive lookup).
            examples:
              byId: { value: { tagId: 4f6c4a3e-2b1d-4c8a-9e50-1a2b3c4d5e6f } }
              byName: { value: { name: priority } }
      responses:
        "200":
          description: Current tag list for the record (after assignment)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/TagObject"
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientPermissions" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }
  /accounts/{id}/tags/{tagId}:
    delete:
      tags: [Tags]
      operationId: removeAccountTag
      summary: Remove a tag from a account
      description: >
        Removes a tag assignment. Requires the `crm.write` scope and an
        organization-scoped key. Returns 204 even when the assignment did not
        exist (idempotent); 404 when the record or tag is missing or cross-org.


        `curl -X DELETE -H "x-api-key: $KEY" https://crm.example.com/api/v1/external/accounts/ACCT-2025-00001/tags/$TAG_ID`
      parameters:
        - $ref: "#/components/parameters/RecordId"
        - $ref: "#/components/parameters/TagIdPath"
      responses:
        "204":
          description: Assignment removed (or did not exist).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/InsufficientPermissions" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

